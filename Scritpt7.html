<!DOCTYPE html>
<html>
<head>
 <title>Exemplo de onBlur</title>
</head>
<body>
 <h1>Exemplo de onBlur</h1>
 <form>
 <label for="nome">Nome:</label>
 <input type="text" id="nome" onblur="validarNome()">
 <p id="mensagem"></p>
 </form>
 <script>
 function validarNome() {
 var nomeInput = document.getElementById('nome');
 var mensagem = document.getElementById('mensagem');
 if (nomeInput.value === '') {
 mensagem.textContent = 'Por favor, preencha o campo Nome.';
 } else {
 mensagem.textContent = ''; // Limpa a mensagem de erro
 }
 }
 </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
 <title>Exemplo de onSubmit</title>
</head>
<body>
 <h1>Exemplo de onSubmit</h1>
 <form onsubmit="return validarFormulario()">
 <label for="nome">Nome:</label>
 <input type="text" id="nome" required>
 <br>
 <label for="email">Email:</label>
 <input type="email" id="email" required>
 <br>
 <input type="submit" value="Enviar">
 </form>
 <script>
 function validarFormulario() {
 var nome = document.getElementById('nome').value;
 var email = document.getElementById('email').value;
 if (nome === '' || email === '') {
 alert('Por favor, preencha todos os campos.');
 return false; // Impede o envio do formulário se houver campos em branco
 }
 // Lógica adicional de validação pode ser adicionada aqui
 return true; // Permite o envio do formulário se todos os campos estiverem preenchidos
 }
 </script>
</body>
</html>
